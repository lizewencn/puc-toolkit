[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "app-puc-login"
version = "0.1.0"
description = "Local Python client for standard PUC account login"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.20",
    "requests>=2.31",
    "websocket-client>=1.8",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.setuptools.packages.find]
include = ["app_puc_login", "puc_login"]
